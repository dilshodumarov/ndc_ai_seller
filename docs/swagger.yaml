info:
  contact: {}
  description: Using a translation service as an example
  title: Go Clean Template API
  version: "1.0"
paths:
  /auth/clients/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a single client by its unique identifier (GUID)
      parameters:
      - description: Client ID (GUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/entity.Client'
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/status_http.Response'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: Client Not Found
          schema:
            allOf:
            - $ref: '#/definitions/status_http.Response'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Server Error
          schema:
            allOf:
            - $ref: '#/definitions/status_http.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - BearerAuth: []
      summary: Get client by ID
      tags:
      - AUTH
  /auth/clients/list:
    get:
      consumes:
      - application/json
      description: Get a list of clients with optional filtering by name, phone, from,
        goal, order_status and pagination
      parameters:
      - description: Filter by search
        in: query
        name: search
        type: string
      - description: Filter by phone
        in: query
        name: phone
        type: string
      - description: Filter by source (from)
        in: query
        name: from
        type: string
      - description: Filter by goal
        in: query
        name: goal
        type: string
      - description: Filter by client id
        in: query
        name: client_id
        type: integer
      - description: Filter by order status
        in: query
        name: order_status
        type: string
      - default: 10
        description: Limit the number of clients
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number for pagination
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            items:
              $ref: '#/definitions/entity.Client'
            type: array
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/status_http.Response'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Server Error
          schema:
            allOf:
            - $ref: '#/definitions/status_http.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - BearerAuth: []
      summary: Get list of clients
      tags:
      - AUTH
  /auth/clients/pause:
    put:
      consumes:
      - application/json
      description: Pause or unpause a client's chat by business ID, platform ID, and
        source type (e.g., bot or channel)
      parameters:
      - description: Pause Chat Request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/entity.PauzeChat'
      produces:
      - application/json
      responses:
        "200":
          description: Chat pause status updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/status_http.Response'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/status_http.Response'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/status_http.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - BearerAuth: []
      summary: Pause or unpause chat for a client
      tags:
      - AUTH
  /auth/clients/update:
    put:
      consumes:
      - application/json
      description: Update a client by   ID
      parameters:
      - description: Update Client Request
        in: body
        name: data
