syntax = "proto3";

package auth;

option go_package = "genproto/auth_service";


// Message definitions
message User {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone_number = 5;
  string password = 6;
  bool is_active = 7;
  string role_id = 8;
  Role role_data = 9;
  string created_at = 10;
  string updated_at = 11;
}

message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

message ClientType {
  string id = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

// Request/Response messages
message Empty {}

message CreateUserRequest {
  User user = 1;
}

message GetUserByIDRequest {
  string id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message UpdatePasswordRequest {
  string email = 1;
  string password = 2;
}

message UpdateUserRequest {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message CreateRoleRequest {
  Role role = 1;
}

message GetRoleByIDRequest {
  string id = 1;
}

message GetRoleByNameRequest {
  string name = 1;
}

message GetRolesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message RoleListResponse {
  repeated Role roles = 1;
  int32 total = 2;
}

message UpdateRoleRequest {
  Role role = 1;
}

message DeleteRoleRequest {
  string id = 1;
}

message CreateClientTypeRequest {
  ClientType client_type = 1;
}

message GetClientTypeByIdRequest {
  string id = 1;
}

message GetClientTypeByNameRequest {
  string name = 1;
}

message GetClientTypesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ClientTypeListResponse {
  repeated ClientType client_types = 1;
  int32 total = 2;
}

message UpdateClientTypeRequest {
  ClientType client_type = 1;
}

message DeleteClientTypeRequest {
  string id = 1;
} 