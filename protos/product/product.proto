syntax = "proto3";

package product;

option go_package="genproto/product_service";


// Message definitions
message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
  string category_id = 6;
  Category category = 7;
  string created_at = 8;
  string updated_at = 9;
}

message Category {
  string id = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

message Order {
  string id = 1;
  string user_id = 2;
  string business_id = 3;
  double total_amount = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
}

message OrderProducts {
  string id = 1;
  string order_id = 2;
  string product_id = 3;
  int32 quantity = 4;
  double price = 5;
  Product product = 6;
  string created_at = 7;
  string updated_at = 8;
}

// Request/Response messages
message Empty {}

message CreateProductRequest {
  Product product = 1;
}

message GetProductRequest {
  string id = 1;
}

message UpdateProductRequest {
  Product product = 1;
}

message DeleteProductRequest {
  string id = 1;
}

message CreateCategoryRequest {
  Category category = 1;
}

message GetCategoryRequest {
  string id = 1;
}

message UpdateCategoryRequest {
  Category category = 1;
}

message DeleteCategoryRequest {
  string id = 1;
}

message CreateOrderRequest {
  Order order = 1;
}

message CreateOrderResponse {
  string id = 1;
}

message GetOrderRequest {
  string id = 1;
}

message UpdateOrderRequest {
  Order order = 1;
}

message DeleteOrderRequest {
  string id = 1;
}

message CreateOrderProductsRequest {
  OrderProducts order_products = 1;
}

message GetOrderProductsRequest {
  string id = 1;
}

message UpdateOrderProductsRequest {
  OrderProducts order_products = 1;
}

message DeleteOrderProductsRequest {
  string id = 1;
} 