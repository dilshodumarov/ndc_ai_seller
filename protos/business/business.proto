syntax = "proto3";

package business;

option go_package="genproto/business_service";

// Message definitions
message Business {
  string id = 1;
  string name = 2;
  string description = 3;
  string address = 4;
  string phone = 5;
  string email = 6;
  string created_at = 7;
  string updated_at = 8;
}

// Request/Response messages
message Empty {}

message CreateBusinessRequest {
  Business business = 1;
}

message GetBusinessRequest {
  string id = 1;
}

message GetAllBusinessesRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message GetAllBusinessesResponse {
  repeated Business businesses = 1;
  int32 total = 2;
}

message UpdateBusinessRequest {
  Business business = 1;
}

message DeleteBusinessRequest {
  string id = 1;
  string user_id = 2;
} 